<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoSafe Bangladesh · Admin Panel</title>
<link rel="stylesheet" href="styles.css">
<script src="../js/supabase-config.js"></script>
</head>
<body>
<div id="app"><main class="login-page" style="min-height:100vh;display:grid;place-items:center;background:#f4f6f3"><div style="text-align:center"><img src="ecosafe-logo.png" alt="EcoSafe Bangladesh" style="width:96px;max-width:30vw;height:auto;object-fit:contain"><p style="margin:18px 0 0;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#31533f">Loading admin panel…</p></div></main></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
window.__ecoSafeAdminFailed = function(message){
  var app=document.getElementById('app');
  if(!app) return;
  app.innerHTML='<main class="login-page" style="min-height:100vh;display:grid;place-items:center;background:#f4f6f3;padding:24px"><div style="width:min(520px,100%);background:#fff;padding:34px;border:1px solid #dfe6df;border-radius:18px;box-shadow:0 16px 50px rgba(24,45,32,.08)"><img src="ecosafe-logo.png" alt="EcoSafe Bangladesh" style="width:86px;height:auto;object-fit:contain"><p style="margin:22px 0 8px;font:700 18px/1.3 system-ui,sans-serif;color:#183326">Admin panel could not start.</p><p style="margin:0;color:#66756c;font:14px/1.6 system-ui,sans-serif;word-break:break-word">'+String(message||'Unknown startup error')+'</p><p style="margin:18px 0 0;color:#8a968f;font:12px/1.5 system-ui,sans-serif">Open browser Console (F12 → Console) if you need the exact error.</p></div></main>';
};
window.addEventListener('error',function(e){ if(e && e.error) window.__ecoSafeAdminFailed(e.error.message||String(e.error)); });
window.addEventListener('unhandledrejection',function(e){ window.__ecoSafeAdminFailed(e.reason && (e.reason.message||String(e.reason)) || 'Unhandled startup error'); });
</script>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
